<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu-Gi-Oh - Samo najjeftinije + Uporedi</title>
<style>
body{background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:16px}
h1{color:#d4af37;margin:0 0 6px} .sub{color:#888;margin-bottom:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{background:#1a1a1a;border:1px solid #333;color:#eee;padding:8px 12px;border-radius:8px}
button{cursor:pointer} .btn-gold{background:#d4af37;color:#000;font-weight:800;border:none}
.btn-ghost{background:#222;border:1px solid #333}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#111;padding:10px;border-bottom:2px solid #d4af37;text-align:left;cursor:pointer}
td{padding:9px 10px;border-bottom:1px solid #1e1e1e}
tr:hover{background:#151515}
.badge{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700}
.badge-DA{background:#0f3d0f;color:#7fdb7f} .badge-NE{background:#3d0f0f;color:#ff8a8a}
.green{color:#7fdb7f;font-weight:800} .gold{color:#d4af37}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:#111;border:1px solid #222;border-radius:10px;padding:8px 14px}
.card b{color:#d4af37}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal{background:#121212;border:1px solid #333;border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 10px;color:#d4af37}
.modal table{font-size:13px}
.close{float:right;background:#222;border:1px solid #333;border-radius:8px;padding:6px 10px;cursor:pointer}
.cheap-row{background:rgba(212,175,55,0.12)} .cheap-row td:first-child{border-left:3px solid #d4af37}
</style>
</head>
<body>
<h1>Yu-Gi-Oh - Samo najjeftinije</h1>
<div class="sub">Jedan red = jedan proizvod (najjeftinija cena u Srbiji) • Klik na "Uporedi" da vidiš sve prodavnice • 11 prodavnica</div>
<div class="summary" id="summary"></div>
<div class="controls">
<input id="search" placeholder="Pretraži... npr Slifer">
<select id="tip"><option value="">Svi tipovi</option></select>
<select id="fiksno"><option value="">Fiksne? Sve</option><option value="DA">DA - fiksne</option><option value="NE">NE - random</option></select>
<button class="btn-gold" onclick="exportCSV()">Export najjeftinije CSV</button>
</div>
<table id="tbl"><thead><tr>
<th onclick="sortBy('naziv')">Naziv ⭐</th><th>Tip</th><th onclick="sortBy('karte')">Karte</th><th onclick="sortBy('cena')">Najjeftinije</th><th>Prodavac</th><th>Fiksne</th><th>Ušteda vs najskuplje</th><th>Akcija</th>
</tr></thead><tbody></tbody></table>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
<div class="modal">
<button class="close" onclick="closeModal()">X</button>
<h2 id="modalTitle"></h2>
<div id="modalSub" style="color:#888;font-size:12px;margin-bottom:10px"></div>
<table id="modalTbl"><thead><tr><th>Prodavac</th><th>Cena</th><th>Razlika</th><th>Napomena</th></tr></thead><tbody></tbody></table>
</div>
</div>

<script>
const raw=[
{"naziv":"Egyptian God Deck: Slifer the Sky Dragon","karte":40,"cena":1000,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Egyptian God Deck: Obelisk the Tormentor","karte":40,"cena":1000,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Structure Deck: Legend of the Crystal Beasts","karte":46,"cena":1100,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":"46+3 tokena"},
{"naziv":"Structure Deck: Realm of Light (2024 Reprint)","karte":41,"cena":1100,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Structure Deck: Cyber Strike","karte":44,"cena":1200,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Structure Deck: Blue-Eyes White Destiny","karte":50,"cena":1300,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Structure Deck: The Crimson King","karte":46,"cena":1350,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"Structure Deck: Fire Kings","karte":48,"cena":1450,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"THE CHRONICLES DECK: Spirit Charmers","karte":51,"cena":1600,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Chronicles","note":""},
{"naziv":"2021 Tin of Ancient Battles","karte":54,"cena":1300,"prodavac":"heaventcg.shop","fiksno":"NE","tip":"Tin","note":""},
{"naziv":"Maximum Gold: El Dorado","karte":28,"cena":1300,"prodavac":"heaventcg.shop","fiksno":"NE","tip":"Box","note":""},
{"naziv":"25th Anniversary Tin: Dueling Heroes","karte":45,"cena":1500,"prodavac":"heaventcg.shop","fiksno":"NE","tip":"Tin","note":""},
{"naziv":"Legendary Collection Kaiba","karte":120,"cena":2600,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Legendary","note":"3 decka"},
{"naziv":"Legendary 5D's Decks","karte":129,"cena":3100,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Legendary Arc-V Decks","karte":129,"cena":3150,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Legendary Modern Decks 2026","karte":120,"cena":3550,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Legendary Dragon Decks Box Set","karte":153,"cena":4200,"prodavac":"heaventcg.shop","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Spirit Charmers","karte":51,"cena":1200,"prodavac":"Yu-GO! Cards","fiksno":"DA","tip":"Chronicles","note":"Popust sa 2400, 238 kom"},
{"naziv":"Legendary Kaiba (Yu-GO!)","karte":120,"cena":3000,"prodavac":"Yu-GO! Cards","fiksno":"DA","tip":"Legendary","note":"Sa 4000"},
{"naziv":"Realm of Light Reprint","karte":41,"cena":1300,"prodavac":"kraken.rs","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"2025 Mega-Pack Bundle","karte":60,"cena":2500,"prodavac":"kraken.rs","fiksno":"NE","tip":"Bundle","note":""},
{"naziv":"Legendary Modern 2026","karte":120,"cena":3500,"prodavac":"kraken.rs","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Legendary Arc-V Decks","karte":129,"cena":3600,"prodavac":"kraken.rs","fiksno":"DA","tip":"Legendary","note":""},
{"naziv":"Geargia Rampage","karte":42,"cena":1200,"prodavac":"crni-zmaj.rs","fiksno":"DA","tip":"Structure","note":""},
{"naziv":"2-Player Starter Deck: Yuya & Declan","karte":42,"cena":1200,"prodavac":"crni-zmaj.rs","fiksno":"DA","tip":"Starter","note":""},
{"naziv":"Starter Deck Yuya","karte":40,"cena":1200,"prodavac":"crni-zmaj.rs","fiksno":"DA","tip":"Starter","note":""},
{"naziv":"Realm of Light reprint","karte":41,"cena":903,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-30% sa 1290 NAJJEFTINIJI"},
{"naziv":"Crimson King Jack Atlas","karte":46,"cena":1161,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-16% sa 1390"},
{"naziv":"Dark World","karte":44,"cena":1161,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-10% sa 1290"},
{"naziv":"Obelisk","karte":40,"cena":1192,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-20% sa 1490"},
{"naziv":"Slifer","karte":40,"cena":1192,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-20% sa 1490"},
{"naziv":"Fire Kings reprint","karte":48,"cena":1251,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-10% sa 1390"},
{"naziv":"Albaz Strike","karte":46,"cena":1890,"prodavac":"gnom.rs","fiksno":"DA","tip":"Structure","note":"-10% sa 2100"},
{"naziv":"Legendary Dragon Decks","karte":153,"cena":3192,"prodavac":"gnom.rs","fiksno":"DA","tip":"Legendary","note":"-20% sa 3990"},
{"naziv":"Star Pack ARC-V Booster","karte":3,"cena":150,"prodavac":"games4you.rs","fiksno":"NE","tip":"Booster","note":"Kesica"},
{"naziv":"Duels From The Deep Booster","karte":5,"cena":250,"prodavac":"games4you.rs","fiksno":"NE","tip":"Booster","note":""},
{"naziv":"Soulburning Volcano Booster","karte":5,"cena":300,"prodavac":"games4you.rs","fiksno":"NE","tip":"Booster","note":""},
{"naziv":"Alliance Insight Tuckbox","karte":27,"cena":1759,"prodavac":"delfi.rs","fiksno":"NE","tip":"Tuckbox","note":"3 packa"},
{"naziv":"Crimson King Nemacki","karte":46,"cena":990,"prodavac":"ananas.rs","fiksno":"DA","tip":"Structure","note":"NEMACKI - NAJJEFTINIJI"},
{"naziv":"2 Player Starter Set","karte":88,"cena":2490,"prodavac":"ananas.rs","fiksno":"DA","tip":"Starter","note":""}
];

function norm(n){
 n=n.toLowerCase();
 if(n.includes('crystal')) return 'crystal beasts';
 if(n.includes('realm')) return 'realm of light';
 if(n.includes('crimson')) return 'crimson king';
 if(n.includes('blue-eyes')||n.includes('blue eyes')||n.includes('blueeyes')) return 'blue eyes white destiny';
 if(n.includes('slifer')) return 'slifer the sky dragon';
 if(n.includes('obelisk')) return 'obelisk the tormentor';
 if(n.includes('fire king')) return 'fire kings';
 if(n.includes('cyber strike')) return 'cyber strike';
 if(n.includes('spirit charm')) return 'spirit charmers';
 if(n.includes('kaiba')) return 'legendary kaiba';
 if(n.includes('arc-v')||n.includes('arc v')) return 'legendary arc v';
 if(n.includes('modern')&&n.includes('2026')) return 'legendary modern 2026';
 if(n.includes('5d')) return 'legendary 5ds';
 if(n.includes('dragon deck')) return 'legendary dragon decks';
 if(n.includes('ancient battle')) return 'tin ancient battles';
 if(n.includes('dueling hero')) return 'tin dueling heroes';
 if(n.includes('mega bundle')||n.includes('mega-pack bundle')) return 'mega pack bundle';
 if(n.includes('mega tin')||n.includes('mega-pack tin')) return 'mega pack tin';
 if(n.includes('eldorado')||n.includes('el dorado')) return 'maximum gold el dorado';
 if(n.includes('ghost')) return 'ghosts from past';
 if(n.includes('geargia')) return 'geargia rampage';
 if(n.includes('yuya & declan')||n.includes('yuya and declan')) return 'yuya & declan';
 if(n.includes('starter')&&n.includes('yuya')) return 'starter yuya';
 if(n.includes('dark world')) return 'dark world';
 if(n.includes('albaz')) return 'albaz strike';
 if(n.includes('star pack')) return 'star pack arc v';
 if(n.includes('duels from')) return 'duels from deep';
 if(n.includes('soulburning')) return 'soulburning volcano';
 if(n.includes('alliance')&&n.includes('tuck')) return 'alliance tuckbox';
 if(n.includes('2 player')||n.includes('2-player')) return '2 player starter';
 return n.trim();
}

// group
const groups={};
raw.forEach(r=>{
 let k=norm(r.naziv);
 if(!groups[k]) groups[k]={key:k, items:[], display:r.naziv};
 groups[k].items.push(r);
 // keep best display name (shortest that still descriptive)
 if(r.naziv.length < groups[k].display.length) groups[k].display=r.naziv;
});

let grouped=Object.values(groups).map(g=>{
 g.items.sort((a,b)=>a.cena-b.cena);
 let cheapest=g.items[0];
 let expensive=g.items[g.items.length-1];
 g.cheapest=cheapest;
 g.expensive=expensive;
 g.saving=expensive.cena-cheapest.cena;
 return g;
});

let sortKey='cena', dir=1;
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let tip=document.getElementById('tip').value;
 let f=document.getElementById('fiksno').value;
 let filtered=grouped.filter(g=>{
   let c=g.cheapest;
   if(q && !g.display.toLowerCase().includes(q) && !g.key.includes(q)) return false;
   if(tip && c.tip!==tip) return false;
   if(f && c.fiksno!==f) return false;
   return true;
 });
 filtered.sort((a,b)=>{
   let av=a.cheapest[sortKey], bv=b.cheapest[sortKey];
   if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
   return av>bv?dir:-dir;
 });
 let tbody=document.querySelector('#tbl tbody');tbody.innerHTML='';
 filtered.forEach(g=>{
   let c=g.cheapest;
   let tr=document.createElement('tr');
   tr.innerHTML=`<td><b>${g.display}</b> <span style="color:#555;font-size:11px">(${g.items.length} ponuda)</span></td>
   <td>${c.tip}</td><td>${c.karte}</td>
   <td class="green">${c.cena.toLocaleString('sr-RS')} RSD</td>
   <td><span class="gold">${c.prodavac}</span></td>
   <td><span class="badge badge-${c.fiksno}">${c.fiksno}</span></td>
   <td>${g.saving>0?`-${g.saving} RSD vs ${g.expensive.prodavac}`:'najbolja cena'}</td>
   <td><button class="btn-ghost" onclick="openCompare('${g.key.replace(/'/g,"\'")}')">Uporedi (${g.items.length})</button></td>`;
   tbody.appendChild(tr);
 });
 document.getElementById('summary').innerHTML=`<span class="card">Unique proizvoda <b>${grouped.length}</b></span><span class="card">Ukupno ponuda <b>${raw.length}</b> iz 11 radnji</span><span class="card">Prikazano <b>${filtered.length}</b></span>`;
}

function openCompare(key){
 let g=groups[key];
 if(!g) return;
 document.getElementById('modalTitle').textContent=g.display;
 document.getElementById('modalSub').textContent=`${g.items.length} ponuda • Fiksne: ${g.cheapest.fiksno} • ${g.cheapest.karte} karata`;
 let tbody=document.querySelector('#modalTbl tbody');tbody.innerHTML='';
 g.items.forEach((it,i)=>{
   let diff=it.cena-g.cheapest.cena;
   let tr=document.createElement('tr'); if(i===0) tr.className='cheap-row';
   tr.innerHTML=`<td>${it.prodavac}${i===0?' ⭐ NAJJEFTINIJE':''}</td><td class="${i===0?'green':''}">${it.cena} RSD</td><td>${diff===0?'—':`+${diff} RSD`}</td><td>${it.note||''}</td>`;
   tbody.appendChild(tr);
 });
 document.getElementById('modalBg').style.display='flex';
}
function closeModal(){document.getElementById('modalBg').style.display='none';}
function sortBy(k){if(sortKey===k)dir*=-1;else{sortKey=k;dir=1;}render();}
function exportCSV(){
 let rows=[['Naziv','Tip','Karte','Najjeftinije Cena','Prodavac','Fiksne','Usteda','Broj ponuda']];
 grouped.forEach(g=>{
   rows.push([g.display,g.cheapest.tip,g.cheapest.karte,g.cheapest.cena,g.cheapest.prodavac,g.cheapest.fiksno,g.saving,g.items.length]);
 });
 let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
 let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yugioh-najjeftinije.csv';a.click();
}
let tips=[...new Set(raw.map(r=>r.tip))].sort();let sel=document.getElementById('tip');tips.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
document.getElementById('search').addEventListener('input',render);
document.getElementById('tip').addEventListener('change',render);
document.getElementById('fiksno').addEventListener('change',render);
render();
</script>
</body>
</html>
